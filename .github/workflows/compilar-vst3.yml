name: Compilar PlayStage Sampler VST3

on:
  push:
    branches: [main]
    paths:
      - "Source/VST3/**"
      - "CMakeLists.txt"
      - ".github/workflows/compilar-vst3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-intel:
    name: VST3 macOS Catalina Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JUCE
        run: cmake -S . -B .build-vst -G Xcode -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Compilar VST3 e Standalone
        run: cmake --build .build-vst --config Release --target PlayStageSampler_VST3 PlayStageSampler_Standalone --parallel 2
      - name: Empacotar macOS
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find .build-vst -type d -name 'PlayStage Sampler.vst3' -print -quit)"
          app="$(find .build-vst -type d -name 'PlayStage Sampler.app' -path '*/Release/*' -print -quit)"
          test -n "$plugin" && test -n "$app"
          mkdir -p pkg
          cp -R "$plugin" pkg/
          cp -R "$app" pkg/
          codesign --force --deep --sign - 'pkg/PlayStage Sampler.vst3'
          codesign --force --deep --sign - 'pkg/PlayStage Sampler.app'
          ditto -c -k --sequesterRsrc pkg PlayStage_VST3_Catalina_Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PlayStage-VST3-Catalina
          path: PlayStage_VST3_Catalina_Intel.zip
          if-no-files-found: error

  windows-x64:
    name: VST3 Windows 64 bits
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JUCE
        shell: pwsh
        run: cmake -S . -B .build-vst -G "Visual Studio 17 2022" -A x64
      - name: Compilar VST3 e Standalone
        shell: pwsh
        run: cmake --build .build-vst --config Release --target PlayStageSampler_VST3 PlayStageSampler_Standalone --parallel 2
      - name: Empacotar Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vst = Get-ChildItem ".build-vst" -Recurse -Directory -Filter "PlayStage Sampler.vst3" | Select-Object -First 1
          $exe = Get-ChildItem ".build-vst" -Recurse -File -Filter "PlayStage Sampler.exe" | Where-Object { $_.FullName -like "*Standalone*" } | Select-Object -First 1
          if (!$vst -or !$exe) { throw "VST3 ou Standalone nao encontrado" }
          New-Item -ItemType Directory pkg -Force | Out-Null
          Copy-Item $vst.FullName pkg -Recurse
          Copy-Item $exe.FullName pkg
          Compress-Archive -Path "pkg\*" -DestinationPath PlayStage_VST3_Windows_x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PlayStage-VST3-Windows-x64
          path: PlayStage_VST3_Windows_x64.zip
          if-no-files-found: error

  publicar:
    name: Publicar pre-alfa no GitHub
    runs-on: ubuntu-latest
    needs: [mac-intel, windows-x64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PlayStage-VST3-*
          merge-multiple: true
          path: saida
      - name: Conferir arquivos
        run: |
          test -s saida/PlayStage_VST3_Catalina_Intel.zip
          test -s saida/PlayStage_VST3_Windows_x64.zip
      - name: Criar Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.0-vst3-prealpha \
            saida/PlayStage_VST3_Catalina_Intel.zip \
            saida/PlayStage_VST3_Windows_x64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "PlayStage Sampler 0.6 - VST3 macOS e Windows (pre-alfa)" \
            --notes "Instrumento VST3 e Standalone com 4 camadas, mapas .psmap do Ableton Live 11, regioes MIDI e velocidade, WAV/AIFF, volume, transpose, mute, solo e reverb. Sem samples comerciais, sem dispositivos exclusivos do Ableton, sem AU ou MainStage. Os bancos externos continuam na maquina do usuario. Experimental: teste antes de usar em palco." \
            --prerelease
