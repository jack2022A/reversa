name: Compilar app macOS Intel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  app-macos:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - name: Baixar fontes
        uses: actions/checkout@v4

      - name: Preparar CMake
        run: cmake -S . -B .build -G Xcode -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Compilar aplicativo nativo
        run: cmake --build .build --config Release --parallel 2

      - name: Compactar app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find .build -type d -name 'PlayStage VST3 Catalina.app' -path '*/Release/*' -print -quit)"
          test -n "$app_path"
          codesign --force --deep --sign - "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" PlayStage_VST3_Catalina_Intel.zip

      - name: Publicar compilacao pre-alfa no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.0-catalina-prealpha >/dev/null 2>&1; then
            gh release upload v0.4.0-catalina-prealpha PlayStage_VST3_Catalina_Intel.zip --clobber
          else
            gh release create v0.4.0-catalina-prealpha PlayStage_VST3_Catalina_Intel.zip \
              --title "PlayStage Live 0.4 - VST3 + Samples Ableton (pre-alfa)" \
              --notes "Agora somente VST3 (Audio Unit removido); sem MainStage. Motor nativo de samples WAV/AIFF/FLAC da biblioteca Ableton, mapeados cromaticamente a partir da nota MIDI 60, alem de dez programas, quatro camadas, zonas MIDI, EQ, envelope, reverb e master. Sem suporte direto a .adg/.adv/.alp/.als/.amxd nem conversao de presets do Live. Alvo macOS Intel 10.15. Teste antes de uso ao vivo." \
              --prerelease --target "${GITHUB_SHA}"
          fi

      - name: Baixar app pronto em Actions / Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PlayStage-VST3-Catalina-Intel
          path: PlayStage_VST3_Catalina_Intel.zip
          if-no-files-found: error
